services:
  # ── Monitoring group ──────────────────────────────
  uptime:
    image: nginx:alpine
    container_name: mylab-uptime
    labels:
      mylab.name: "Uptime Kuma 2"
      mylab.url: "https://status.local"
      mylab.icon: "https://cdn.jsdelivr.net/gh/selfhst/icons@main/webp/uptimekuma.webp"
      mylab.group: "Monitoring"
      mylab.description: "Status page for all services"
      mylab.weight: "10"

  grafana:
    image: nginx:alpine
    container_name: mylab-grafana
    labels:
      mylab.name: "Grafana"
      mylab.url: "https://grafana.local"
      mylab.icon: "grafana"
      mylab.group: "Monitoring"
      mylab.description: "Metrics and dashboards"
      mylab.weight: "20"

  # ── Media group ───────────────────────────────────
  plex:
    image: nginx:alpine
    container_name: mylab-plex
    labels:
      mylab.name: "Plex"
      mylab.url: "https://media.local"
      mylab.icon: "plex"
      mylab.group: "Media"
      mylab.description: "Media streaming server"
      mylab.weight: "10"

  # ── Hidden (no mylab labels) ───────────────────────
  hidden:
    image: nginx:alpine
    container_name: mylab-hidden

  # ── Disabled explicitly ──────────────────────────
  disabled:
    image: nginx:alpine
    container_name: mylab-disabled
    labels:
      mylab.enable: "false"
      mylab.name: "Should not appear"
